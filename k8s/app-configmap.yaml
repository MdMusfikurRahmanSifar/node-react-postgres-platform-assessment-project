apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dev
data:
  DB_HOST: postgres-service
  DB_PORT: "5432"
  DB_NAME: appdb
  REDIS_URL: redis://redis-service:6379
  SEARCH_URL: http://search-service:9200
  # Simulated read/write cluster - both resolve to the same Service here.
  # Point DB_READ_URL at a replica Service to go from simulated to real.
  DB_WRITE_URL: postgres://appuser:apppass@postgres-service:5432/appdb
  DB_READ_URL: postgres://appuser:apppass@postgres-service:5432/appdb
